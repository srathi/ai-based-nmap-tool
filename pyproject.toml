[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-based-nmap-tool"
version = "1.0.0"
description = "AI-Assisted Nmap Scanner"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "nmap>=0.6.1",
    "pyyaml>=6.0",
    "pytz>=2024.1",
]

[tool.vercel]
installCommand = "pip install -r requirements.txt"
buildCommand = "echo 'No build step needed for FastAPI'"
devCommand = "uvicorn backend.main:app --host 0.0.0.0 --port 3000"

[tool.pytest.ini_options]
testpaths = ["tests"]